# Wertstapel – Kontenmatrix
# Fassung 3, Stand 2026-08-28
# Abgestimmt mit der Steuerberaterin, geprüft gegen DATEV SKR 03 (Art.-Nr. 11174)
# und SKR 04 (Art.-Nr. 11175), gültig für 2026.
#
# Diese Datei ist die EINZIGE Quelle für Kontonummern. Im Code darf keine
# Kontonummer mehr als Literal stehen.
#
# Legende status:
#   standard  = im Kontenrahmen belegt, nichts einzurichten
#   anzulegen = im Kontenrahmen unbelegt, von der Kanzlei einmalig anzulegen
#               und mit Kontenzweck / Bilanz- bzw. GuV-Posten zu versehen

version: 3
stand: 2026-08-28

# ---------------------------------------------------------------------------
# Auswahl je Mandant (Frontend)
# ---------------------------------------------------------------------------
mandant_optionen:
  kontenrahmen: [SKR03, SKR04]          # Pflicht
  vermoegensart: [UV, AV]               # Pflicht, Vorgabe UV
  bewertung: [gleitender_durchschnitt, fifo]   # Vorgabe gleitender_durchschnitt
  # Die Bewertungsmethode ist nach § 252 Abs. 1 Nr. 6 HGB beizubehalten und
  # wird deshalb dauerhaft am Mandanten gespeichert, nicht je Export gewählt.

instrumentenklassen:
  - aktie                 # inkl. ADR, § 8b KStG
  - fonds                 # Investmentanteile, § 20 InvStG
  - anleihe               # voll steuerpflichtig
  - derivat_verbrieft     # Zertifikate, Optionsscheine, Turbos, Faktor-Zertifikate

# Echte Optionen, Futures und CFDs werden NICHT gebucht.
# Sie erzeugen einen UngebuchterBeleg mit Begründung.
nicht_abbildbar:
  - option_stillhalter
  - future
  - cfd

fondskategorien:
  - aktienfonds
  - mischfonds
  - immobilienfonds
  - rentenfonds_sonstige
  - unbestimmt

# Teilfreistellung für Körperschaften (§ 20 InvStG), nur informativ –
# das Tool rechnet sie nie, sondern schreibt sie als Marker in den Buchungstext.
teilfreistellung_koerperschaft:
  aktienfonds: 80
  mischfonds: 40
  immobilienfonds: 60
  immobilienfonds_ausland: 80
  rentenfonds_sonstige: 0
  unbestimmt: null

# Ableitung der Kategorie aus dem von der Bank angewandten Privatanlegersatz.
# Schlüssel ist der Bankwert in Prozent.
kategorie_aus_banksatz:
  30: aktienfonds
  15: mischfonds
  60: immobilienfonds
  80: immobilienfonds_ausland
  0: rentenfonds_sonstige

marker:
  teilfreistellung: { aktienfonds: "#TF80#", mischfonds: "#TF40#",
                      immobilienfonds: "#TF60#", immobilienfonds_ausland: "#TF80#",
                      rentenfonds_sonstige: "#TF0#", unbestimmt: "#TF?#" }
  dividende: "#DIV#"
  vorabpauschale: "#VORABP#"
  ak_pruefen: "#AK-PRÜFEN#"
  depot_pruefen: "#DEPOT-PRÜFEN#"
  adr: "#ADR#"
  check: "#CHECK#"
  klasse: "#KLASSE#"
  lot_pruefen: "#LOT-PRÜFEN#"   # nur bei bewertung=fifo und fehlendem Closed-Lot-Detail
buchungstext_max_laenge: 60      # DATEV-Feldgrenze, Marker als Präfix

